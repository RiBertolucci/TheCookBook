<div id="app-container" class="app-shell" [class.dark-mode]="theme === 'dark'" [class.light-mode]="theme === 'light'">
  <div id="top-toolbar" class="top-toolbar">
    <div class="title-block">
      <h1 class="app-title">{{ title }}</h1>
      <span class="app-subtitle">Knowledge base navigator</span>
    </div>

    <div class="toolbar-actions">
      <button id="create-button" class="btn btn-sm btn-success toolbar-icon-btn" (click)="goToEdit()" *ngIf="!isEditPage">+</button>
      <button id="back-button" class="btn btn-sm btn-outline-primary" (click)="goToBrowse()" *ngIf="isEditPage">Back</button>

      <button id="sync-button" class="btn btn-sm btn-primary" (click)="runSync()" [disabled]="isSyncing || isEditPage">
        {{ isSyncing ? 'Syncing...' : 'Sync' }}
      </button>

      <div id="settings-menu" class="settings-menu">
        <button id="settings-button" class="btn btn-sm btn-outline-secondary" (click)="toggleSettings()">
          Settings
        </button>
        <div class="settings-popover" *ngIf="isSettingsOpen">
          <div class="settings-label">Theme</div>
          <button class="theme-option" [class.active]="theme === 'light'" (click)="setTheme('light')">Light</button>
          <button class="theme-option" [class.active]="theme === 'dark'" (click)="setTheme('dark')">Dark</button>
          <div class="settings-label">Index</div>
          <button class="theme-option" (click)="runForceIndexing()" [disabled]="isForceIndexing">
            {{ isForceIndexing ? 'Force Indexing...' : 'Force Indexing' }}
          </button>

          <div class="settings-label">Telegram</div>
          <button class="theme-option" (click)="addTelegramUser()" [disabled]="isAddingTelegramUser">
            {{ isAddingTelegramUser ? 'Adding user...' : 'Add user' }}
          </button>
          <div
            *ngIf="telegramAddUserMessage"
            class="settings-note"
            [class.error]="telegramAddUserError"
            [title]="telegramAddUserMessage">
            {{ telegramAddUserMessage }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="main-tabs" *ngIf="!isEditPage">
    <button class="main-tab" [class.active]="activeMainTab === 'overview'" (click)="setMainTab('overview')">Overview</button>
    <button class="main-tab" [class.active]="activeMainTab === 'search'" (click)="setMainTab('search')">Search</button>
    <button class="main-tab" [class.active]="activeMainTab === 'shopping'" (click)="setMainTab('shopping')">Shopping list</button>
    <button class="main-tab" [class.active]="activeMainTab === 'mixer'" (click)="setMainTab('mixer')">Ingredients mixer</button>
  </div>

  <div class="main-tab-content" *ngIf="!isEditPage">
    <app-content-browser
      *ngIf="activeMainTab === 'overview'"
      (editRequested)="onEditRequested($event)"
      (syncStateChange)="onSyncStateChanged($event)">
    </app-content-browser>

    <app-search-tab *ngIf="activeMainTab === 'search'"></app-search-tab>
    <app-shopping-list *ngIf="activeMainTab === 'shopping'"></app-shopping-list>
    <app-ingredients-mixer *ngIf="activeMainTab === 'mixer'"></app-ingredients-mixer>
  </div>

  <app-content-editor
    *ngIf="isEditPage"
    [editRequest]="activeEditRequest"
    (savedExisting)="onExistingSaved()">
  </app-content-editor>
</div>

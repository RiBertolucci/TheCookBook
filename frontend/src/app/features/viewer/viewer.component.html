<div class="container mt-4">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h2 style="margin:0">{{ selected?.filename || filename }}</h2>
    <div>
      <button class="btn btn-sm btn-outline-secondary me-2" (click)="close()">Close</button>
    </div>
  </div>
  <div class="border p-3 mt-3" *ngIf="renderedContent" [innerHTML]="renderedContent" (click)="onRenderedClick($event)"></div>
  <pre class="border p-3 mt-3" *ngIf="!renderedContent">{{ selected?.content }}</pre>
</div>
